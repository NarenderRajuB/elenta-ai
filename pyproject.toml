# Project metadata and tool configuration for the ELENTA local chat service.
# Dependencies are added only when a feature needs them (see docs/architecture-decisions.md).

[project]
name = "elenta-ai"
version = "0.1.0"
description = "Local, containerised chat service that answers from a live document corpus."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "pip-audit>=2.10.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets tests import the app package from the repo root without installing it.
pythonpath = ["."]
# Container tests build the image and start containers (slow, need Docker).
# Excluded by default; run them with: uv run pytest -m container
markers = ["container: builds and runs the Docker image (slow; needs Docker)"]
addopts = "-m 'not container'"

# --- Code quality and security checks (REQ-121, REQ-122) ---------------------------
# Rule sets are listed explicitly so results don't change when a tool's defaults change.

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import order, B bugbear, UP pyupgrade, C4 comprehensions,
# PERF performance, RUF ruff-specific. Security rules are left to bandit.
select = ["E", "W", "F", "I", "B", "UP", "C4", "PERF", "RUF"]
# The look-alike brackets are deliberate: prompt assembly replaces <<< and >>> in
# untrusted text with them so evidence can't forge block markers (ADR-006 C2).
allowed-confusables = ["‹", "›"]

[tool.mypy]
python_version = "3.12"
files = ["app", "scripts"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
