# Compose definition for the ELENTA chat service (REQ-011; ADR-012, ADR-013).
#
# `docker compose up` starts the application. The model server (Ollama) runs natively
# on the host and is a documented prerequisite (ADR-013); /readyz reports when it is
# missing. Variables below are read from .env (copy .env.example).

services:
  app:
    build: .
    image: elenta-ai:local
    environment:
      # Required. Empty if .env is missing, so the app exits with code 2 and names them (REQ-016).
      LLM_URL: ${LLM_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_HEALTH_TIMEOUT_SECONDS: ${LLM_HEALTH_TIMEOUT_SECONDS:-}
      # Fixed inside the container: must listen on all interfaces for the published
      # port to work, and the port must match the mapping below. Exposure to the
      # network is controlled by the host-side 127.0.0.1 binding, not by APP_HOST.
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"
      # Fixed: must match the volume target below.
      CORPUS_DIR: /data
      # Optional settings from .env. Every variable in .env.example is listed here except
      # the four fixed in this file; a test enforces it, so a setting in .env can't be
      # silently ignored. Empty means the documented default.
      CORPUS_MAX_FILE_BYTES: ${CORPUS_MAX_FILE_BYTES:-}
      CORPUS_MAX_FILES: ${CORPUS_MAX_FILES:-}
      CORPUS_SETTLE_SECONDS: ${CORPUS_SETTLE_SECONDS:-}
      CHUNK_MAX_CHARS: ${CHUNK_MAX_CHARS:-}
      CONTEXT_TOKEN_BUDGET: ${CONTEXT_TOKEN_BUDGET:-}
      SELECTION_MIN_SCORE: ${SELECTION_MIN_SCORE:-}
      LLM_CONTEXT_TOKENS: ${LLM_CONTEXT_TOKENS:-}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-}
      LLM_CONNECT_TIMEOUT_SECONDS: ${LLM_CONNECT_TIMEOUT_SECONDS:-}
      LLM_READ_TIMEOUT_SECONDS: ${LLM_READ_TIMEOUT_SECONDS:-}
      LLM_REQUEST_TIMEOUT_SECONDS: ${LLM_REQUEST_TIMEOUT_SECONDS:-}
      # Traces go to the bundled local Jaeger over the Compose network (ADR-008, REQ-085).
      OTLP_TRACES_URL: http://jaeger:4318/v1/traces
    ports:
      # Published on host loopback only: reachable from this machine, not the LAN.
      - "127.0.0.1:8000:8000"
    volumes:
      # Corpus mounted read-only; the app never writes to it (REQ-040, REQ-067).
      - ./data:/data:ro
    extra_hosts:
      # Docker Desktop provides host.docker.internal already; this line makes the same
      # LLM_URL work on native Linux Docker, where it does not exist by default.
      - "host.docker.internal:host-gateway"
    # Hardening (ADR-012): nothing in the app needs to write to its own filesystem,
    # change privileges or use Linux capabilities.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      - jaeger
    healthcheck:
      # Liveness only (ADR-015): a model outage must not mark the app unhealthy.
      # The slim image has no curl, so Python's standard library is used.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Local trace viewer (ADR-008): receives OTLP/HTTP on 4318 inside the Compose network
  # only, and serves its UI on host loopback. Spans are kept in memory: they are lost
  # when this container restarts (documented limitation). Image pinned by digest so the
  # offline setup is repeatable.
  jaeger:
    image: jaegertracing/jaeger:2.22.0@sha256:836b967b5abcf1f7758066aa6b348619267a2f1459f72d472840570f9bd88a17
    ports:
      - "127.0.0.1:16686:16686"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
