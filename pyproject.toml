# Project metadata and tool configuration for the ELENTA local chat service.
# Dependencies are added only when a feature needs them (see docs/architecture-decisions.md).

[project]
name = "elenta-ai"
version = "0.1.0"
description = "Local, containerised chat service that answers from a live document corpus."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets tests import the app package from the repo root without installing it.
pythonpath = ["."]
